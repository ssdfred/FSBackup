[tool.pytest.ini_options]
testpaths = ["tests", "app/modules"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/**/tests/*",
    "app/**/tests/**/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
