name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, Pytest et couverture
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Vérifier le code avec Ruff
        run: python -m ruff check .

      - name: Exécuter les tests avec couverture
        run: >-
          python -m pytest
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-report=html
          --cov-report=xml

      - name: Publier le rapport HTML de couverture
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: backend/htmlcov
          if-no-files-found: error
          retention-days: 14

      - name: Publier le rapport XML de couverture
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 14
